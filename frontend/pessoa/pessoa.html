<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pessoa</title>
    <link rel="stylesheet" href="./pessoa.css">
</head>

<body>
    <header>
        <h1>CRUD Pessoa</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Pessoa</h2>

            <form id="pessoaForm">
                <div class="search-container">
                    <label for="searchId">Buscar por CPF:</label>
                    <div class="search-input-group">
                        <input type="text" id="searchId" placeholder="Digite o CPF para buscar" maxlength="20">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados da Pessoa</legend>

                    <div class="form-group">
                        <label for="nome_pessoa">Nome:</label>
                        <input type="text" id="nome_pessoa" name="nome_pessoa" maxlength="60" required>
                    </div>

                    <div class="form-group">
                        <label for="data_nascimento_pessoa">Data de nascimento:</label>
                        <input type="date" id="data_nascimento_pessoa" name="data_nascimento_pessoa">
                    </div>

                    <div class="form-group">
                        <label for="endereco_pessoa">Endereço:</label>
                        <input type="text" id="endereco_pessoa" name="endereco_pessoa" maxlength="150">
                    </div>

                    <div class="form-group">
                        <label for="telefone_pessoa">Telefone:</label>
                        <input type="text" id="telefone_pessoa" name="telefone_pessoa" maxlength="20">
                    </div>

                    <div class="form-group">
                        <label for="email_pessoa">E-mail:</label>
                        <input type="email" id="email_pessoa" name="email_pessoa" maxlength="75">
                    </div>

                    <div class="form-group">
                        <label for="usuario_pessoa">Usuário:</label>
                        <input type="text" id="usuario_pessoa" name="usuario_pessoa" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="senha_pessoa">Senha:</label>
                        <input type="password" id="senha_pessoa" name="senha_pessoa" maxlength="50">
                    </div>
                </fieldset>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="pessoasTable">
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Nascimento</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                        </tr>
                    </thead>
                    <tbody id="pessoasTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Pessoa</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="./pessoa.js" defer></script>

</body>

</html>
