<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Coleção</title>
    <link rel="stylesheet" href="./colecao.css">
</head>

<body>
    <header>
        <h1>CRUD Coleção</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Coleção</h2>

            <form id="colecaoForm">
                <div class="search-container">
                    <label for="searchId">Buscar por ID:</label>
                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar" min="1">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados da Coleção</legend>

                    <div class="form-group">
                        <label for="id_colecao">ID:</label>
                        <input type="text" id="id_colecao" name="id_colecao" readonly disabled
                            placeholder="Gerado automaticamente">
                    </div>

                    <div class="form-group">
                        <label for="nome_colecao">Nome da coleção:</label>
                        <input type="text" id="nome_colecao" name="nome_colecao" maxlength="60" required>
                    </div>
                </fieldset>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="colecoesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                        </tr>
                    </thead>
                    <tbody id="colecoesTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Coleção</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="./colecao.js" defer></script>

</body>

</html>
