<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pedido</title>
    <link rel="stylesheet" href="./pedido.css">
    <style>
        /* Estilo mínimo da tabela de itens (dentro do formulário) */
        .itens-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .itens-table th, .itens-table td { padding: 6px; text-align: left; }
        .itens-table select, .itens-table input { width: 100%; box-sizing: border-box; }
        .total-pedido { margin-top: 10px; font-weight: bold; }
    </style>
</head>

<body>
    <header>
        <h1>CRUD Pedido</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Pedido</h2>

            <form id="pedidoForm">
                <div class="search-container">
                    <label for="searchId">Buscar por ID:</label>
                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar" min="1">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados do Pedido</legend>

                    <div class="form-group">
                        <label for="id_pedido">ID:</label>
                        <input type="text" id="id_pedido" name="id_pedido" readonly disabled
                            placeholder="Gerado automaticamente">
                    </div>

                    <div class="form-group">
                        <label for="data_pedido">Data do pedido:</label>
                        <input type="date" id="data_pedido" name="data_pedido">
                    </div>

                    <div class="form-group">
                        <label for="cliente_pessoa_cpf_pessoa">Cliente:</label>
                        <select id="cliente_pessoa_cpf_pessoa" name="cliente_pessoa_cpf_pessoa" required>
                            <option value="">Selecione um cliente</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="funcionario_pessoa_cpf_pessoa">Funcionário:</label>
                        <select id="funcionario_pessoa_cpf_pessoa" name="funcionario_pessoa_cpf_pessoa" required>
                            <option value="">Selecione um funcionário</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Itens do pedido:</label>
                        <table class="itens-table" id="itensTable">
                            <thead>
                                <tr>
                                    <th>Produto / Tom</th>
                                    <th>Quantidade</th>
                                    <th>Preço unitário</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="itensTableBody">
                                <!-- Linhas criadas dinamicamente -->
                            </tbody>
                        </table>
                        <button type="button" id="btnAdicionarItem" class="btn-secondary"
                            style="display: none;">+ Adicionar item</button>
                    </div>

                    <div class="total-pedido">
                        Total do pedido: <span id="totalPedido">R$ 0,00</span>
                        <span id="infoPago"></span>
                    </div>
                </fieldset>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="pedidosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Funcionário</th>
                            <th>Itens</th>
                            <th>Total</th>
                            <th>Pago</th>
                        </tr>
                    </thead>
                    <tbody id="pedidosTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Pedido</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="./pedido.js" defer></script>

</body>

</html>
