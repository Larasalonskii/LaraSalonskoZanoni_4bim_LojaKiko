<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Funcionário</title>
    <link rel="stylesheet" href="./funcionario.css">
</head>

<body>
    <header>
        <h1>CRUD Funcionário</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Funcionário</h2>

            <form id="funcionarioForm">
                <div class="search-container">
                    <label for="searchId">Buscar por CPF:</label>
                    <div class="search-input-group">
                        <input type="text" id="searchId" placeholder="Digite o CPF para buscar" maxlength="20">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados do Funcionário</legend>

                    <div class="form-group">
                        <label for="pessoa_cpf_pessoa">CPF (pessoa já cadastrada):</label>
                        <input type="text" id="pessoa_cpf_pessoa" name="pessoa_cpf_pessoa" maxlength="20" required>
                    </div>

                    <div class="form-group">
                        <label for="nome_pessoa">Nome:</label>
                        <input type="text" id="nome_pessoa" name="nome_pessoa" readonly disabled
                            placeholder="Preenchido automaticamente ao buscar">
                    </div>

                    <div class="form-group">
                        <label for="salario_funcionario">Salário (R$):</label>
                        <input type="number" id="salario_funcionario" name="salario_funcionario" min="0" step="0.01"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="cargo_id_cargo">Cargo:</label>
                        <select id="cargo_id_cargo" name="cargo_id_cargo" required>
                            <option value="">Selecione um cargo</option>
                        </select>
                    </div>
                </fieldset>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="funcionariosTable">
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Salário</th>
                        </tr>
                    </thead>
                    <tbody id="funcionariosTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Funcionário</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="./funcionario.js" defer></script>

</body>

</html>
